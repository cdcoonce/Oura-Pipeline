# Dagster Cloud was retired; the serverless branch-deployment jobs were removed
# so CI no longer fails on the missing DAGSTER_CLOUD_API_TOKEN. The pytest job
# is kept as the PR gate (plus manual dispatch). See docs/local-scheduling.md.
name: PR Tests
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.ref }}/pr-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install uv && uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -x --ignore=tests/test_snowflake_resource.py --ignore=tests/test_upsert_day.py --ignore=tests/test_asset_checks.py
