version: 2

models:
  - name: fact_sleep_detail
    description: >
      Detailed sleep period fact table joining individual sleep periods with
      optimal bedtime recommendations. Grain is one row per sleep period.
    columns:
      - name: id
        description: Unique identifier for the sleep period, inherited from stg_sleep_periods.
        tests: [not_null, unique]
      - name: day
        description: Calendar date the sleep period is attributed to.
        tests: [not_null]
      - name: sleep_type
        description: Classification of the sleep period (long_sleep, rest, nap, late_nap).
        tests: [not_null]
      - name: bedtime_start
        description: Timestamp when the sleep period began.
      - name: bedtime_end
        description: Timestamp when the sleep period ended.
      - name: total_sleep_duration
        description: Total seconds of sleep within the period.
      - name: deep_sleep_duration
        description: Total seconds of deep sleep within the period.
      - name: light_sleep_duration
        description: Total seconds of light sleep within the period.
      - name: rem_sleep_duration
        description: Total seconds of REM sleep within the period.
      - name: awake_time
        description: Total seconds spent awake during the period.
      - name: time_in_bed
        description: Total seconds spent in bed during the period.
      - name: efficiency
        description: Sleep efficiency percentage for the period.
      - name: latency
        description: Seconds from bedtime to falling asleep.
      - name: avg_hr
        description: Average heart rate in beats per minute during sleep.
      - name: avg_hrv
        description: Average heart rate variability in milliseconds during sleep.
      - name: lowest_hr
        description: Lowest heart rate in beats per minute during sleep.
      - name: avg_breath
        description: Average breaths per minute during sleep.
      - name: restless_periods
        description: Count of restless periods during sleep.
      - name: sleep_recommendation
        description: Oura-generated sleep recommendation for the day.
      - name: optimal_bedtime_start_offset
        description: Recommended bedtime start as seconds offset from midnight.
      - name: optimal_bedtime_end_offset
        description: Recommended bedtime end as seconds offset from midnight.

  - name: fact_daily_wellness
    description: >
      Daily wellness fact table combining sleep scores, activity metrics, readiness,
      SpO2, stress, and resilience into a single wide row per day via a date spine.
    columns:
      - name: day
        description: Calendar date serving as the grain of this table.
        tests: [not_null, unique]
      - name: readiness_score
        description: Overall readiness score calculated by Oura (0-100).
      - name: steps
        description: Total step count for the day.
      - name: calories
        description: Total calories burned for the day.
      - name: sleep_score
        description: Overall sleep score calculated by Oura (0-100).
      - name: sleep_efficiency
        description: Sleep efficiency contributor score (0-100).
      - name: avg_spo2_pct
        description: Average blood oxygen saturation percentage for the night.
      - name: breathing_disturbance_index
        description: Index measuring breathing irregularities during sleep.
      - name: stress_high
        description: Total seconds spent in high stress during the day.
      - name: recovery_high
        description: Total seconds spent in high recovery during the day.
      - name: stress_summary
        description: Oura-generated text summary of the day's stress pattern.
      - name: resilience_level
        description: Categorical resilience rating for the day.
      - name: sleep_recovery_score
        description: Resilience contributor score for sleep recovery.
      - name: daytime_recovery_score
        description: Resilience contributor score for daytime recovery.
      - name: resilience_stress_score
        description: Resilience contributor score for stress management.
